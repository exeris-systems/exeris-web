# Behaviour tests for this repository's roles — agents-md-schema.md rule 14.
#
# Runtime-independent on purpose: a case names a fixture, a prompt, the schema the answer must
# conform to, and assertions over its fields. `run.py` drives whichever CLI is available; nothing
# here mentions one.
#
# Graders are deterministic — equality, membership, counts. A case that can be an assertion is one,
# because a judged run costs a model call and returns a number nobody can reproduce.
#
# What these cover is chosen by what the site would wrongly SAY or LOAD, which is this repository's
# characteristic failure: a sentence that passes every type check. Each fixture is written as a
# plausible change rather than an obvious violation — a case a reviewer has to think about is the
# only kind that tests anything. Fixtures are diffs with invented context; the figures and claim
# strings in them are not the register's.
#
# Run:
#   python3 .agents/vendor/exeris-agents-2.1.0/evals/run.py --dry-run     # resolve, invoke nothing
#   python3 .agents/vendor/exeris-agents-2.1.0/evals/run.py --tags claims
#
# On demand and on a schedule, never on every pull request. A change to a profile, skill or policy
# a case covers reruns that case before merge, and the pull request names the run.
version: 1

defaults:
  schema_dir: ../schemas
  fixture_dir: fixtures

cases:
  # ── triage ────────────────────────────────────────────────────────────────────────────────
  # The router's output contract, made checkable. A copy edit with a figure in it is a claims
  # task, not a layout task, and routing it to the implementer first is the failure.
  - id: triage-figure-in-copy-is-claims
    agent: exeris-web-router
    fixture: typed-figure-in-hero.diff
    prompt: "Triage this proposed change."
    expect:
      schema: triage-result.schema.json
      fields:
        task_class: CLAIMS_AND_FIGURES
        primary_agent: exeris-web-reviewer
    tags: [triage, claims]

  - id: triage-header-is-privacy
    agent: exeris-web-router
    fixture: external-font-and-csp.diff
    prompt: "Triage this proposed change."
    expect:
      schema: triage-result.schema.json
      fields:
        task_class: PRIVACY_AND_HEADERS
        primary_agent: exeris-web-reviewer
    tags: [triage, privacy]

  # ── the site's promises ───────────────────────────────────────────────────────────────────
  # "4x faster" is written as copy, carries no claim id, and the numeric scan may or may not see
  # it depending on how it is spelled. The reviewer must block on the reading.
  - id: claims-typed-figure-blocks
    agent: exeris-web-reviewer
    fixture: typed-figure-in-hero.diff
    prompt: "Review this proposed change."
    expect:
      schema: verdict.schema.json
      fields:
        decision: BLOCKED
        scope_class: copy-and-claims
      min_findings: 1
      contains: ["public-claims.md"]
    tags: [reviewer, claims]

  # No banned phrase is needed to sell a proof of concept. "Available today" and "start a pilot"
  # beside a `poc` cap is the case the content check cannot see.
  - id: readiness-poc-presented-as-available-blocks
    agent: exeris-web-reviewer
    fixture: poc-sold-as-available.diff
    prompt: "Review this proposed change."
    expect:
      schema: verdict.schema.json
      fields:
        decision: BLOCKED
        scope_class: readiness-wording
      min_findings: 1
      contains: ["product-readiness.md"]
    tags: [reviewer, readiness]

  - id: privacy-external-font-and-csp-blocks
    agent: exeris-web-reviewer
    fixture: external-font-and-csp.diff
    prompt: "Review this proposed change."
    expect:
      schema: verdict.schema.json
      fields:
        decision: BLOCKED
        scope_class: privacy-and-headers
      min_findings: 2
      contains: ["no-third-party-requests.md"]
    tags: [reviewer, privacy]

  - id: view-ir-generated-edit-blocks
    agent: exeris-web-reviewer
    fixture: generated-page-patched.diff
    prompt: "Review this proposed change."
    expect:
      schema: verdict.schema.json
      fields:
        decision: BLOCKED
        scope_class: view-ir
      min_findings: 1
      contains: ["view-ir-and-generated-output.md"]
    tags: [reviewer, view-ir]

  # The claim got weaker and the page that quotes it still says "more than twice". Accepting the
  # lock because the regeneration succeeded is exactly what rule 4 forbids.
  - id: claims-lock-regenerated-without-reading-blocks
    agent: exeris-web-reviewer
    fixture: lock-regenerated-blind.diff
    prompt: "Review this proposed change."
    expect:
      schema: verdict.schema.json
      fields:
        decision: BLOCKED
        scope_class: copy-and-claims
      min_findings: 1
      contains: ["view_home.json"]
    tags: [reviewer, claims, lock]

  # ── the case that tests the reviewer rather than the rules ─────────────────────────────────
  # The opposite failure, and the more common one: inventing a finding because a review that
  # returns nothing feels like a review that did not happen.
  - id: copy-typo-passes-without-invention
    agent: exeris-web-reviewer
    fixture: copy-typo.diff
    prompt: "Review this proposed change."
    expect:
      schema: verdict.schema.json
      fields:
        decision: PASS
        scope_class: copy-and-claims
      forbidden: ["BLOCKED", "CONDITIONAL"]
    tags: [reviewer, scope-discipline]
